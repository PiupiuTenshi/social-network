name: Kiểm tra tài liệu

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.ai/**'
      - '.cursor/**'
      - '.claude/**'
      - '.windsurf/**'
      - 'scripts/**'
      - '.github/workflows/docs-validation.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Kiểm tra bộ tài liệu và liên kết
        run: python scripts/validate_vibe_kit.py
