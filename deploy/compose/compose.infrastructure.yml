name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: twilight_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?SOCIAL_DB_PASSWORD is required}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?FEED_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/10-provision-databases.sh:/docker-entrypoint-initdb.d/10-provision-databases.sh:ro
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M }
    networks: [core]
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      TWILIGHT_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:?KAFKA_TOPIC_PREFIX is required}
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M }
    networks: [core]
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
    volumes: ["valkey-data:/data"]
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    networks: [core]
    restart: unless-stopped

  seaweed-master:
    image: chrislusf/seaweedfs:4.21@sha256:e0b528145ea514040ab00d03ff0833f56acb1f0e07aeab232e20485af9278fd8
    command: master -ip=seaweed-master -mdir=/data -defaultReplication=000
    volumes: ["seaweed-master-data:/data"]
    expose: ["9333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    networks: [core]
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs:4.21@sha256:e0b528145ea514040ab00d03ff0833f56acb1f0e07aeab232e20485af9278fd8
    command: volume -mserver=seaweed-master:9333 -dir=/data -max=5
    volumes: ["seaweed-volume-data:/data"]
    expose: ["8080"]
    depends_on:
      seaweed-master: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://seaweed-volume:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    networks: [core]
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs:4.21@sha256:e0b528145ea514040ab00d03ff0833f56acb1f0e07aeab232e20485af9278fd8
    command: filer -master=seaweed-master:9333
    expose: ["8888"]
    depends_on:
      seaweed-master: { condition: service_healthy }
      seaweed-volume: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
    networks: [core]
    restart: unless-stopped

  migration-runner:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["migrate"]
    environment:
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?SOCIAL_DB_PASSWORD is required}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}
      FEED_DB_PASSWORD: ${FEED_DB_PASSWORD:?FEED_DB_PASSWORD is required}
    volumes:
      - ./migrations/run-infrastructure-migration.sh:/opt/twilight/run-infrastructure-migration.sh:ro
    entrypoint: ["/bin/sh", "/opt/twilight/run-infrastructure-migration.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [core]
    restart: "no"

networks:
  core:
    internal: true

volumes:
  postgres-data: {}
  kafka-data: {}
  valkey-data: {}
  seaweed-master-data: {}
  seaweed-volume-data: {}
