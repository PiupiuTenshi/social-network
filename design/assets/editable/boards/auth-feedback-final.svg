<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Auth feedback states final</title><desc id="desc">Twight Light UI/UX vòng duyệt 2, SVG chỉnh sửa được.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset="1" stop-color="#496DFF"/></linearGradient>
  <linearGradient id="twilight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07162B"/><stop offset=".58" stop-color="#2B245B"/><stop offset="1" stop-color="#E05A78"/></linearGradient>
  <linearGradient id="media" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#73B8FF"/><stop offset=".5" stop-color="#7C62E5"/><stop offset="1" stop-color="#FF9A8B"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#07162B" flood-opacity=".14"/></filter>
  <filter id="tinyShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#07162B" flood-opacity=".12"/></filter>
  <style>
    text { font-family: Inter, "Be Vietnam Pro", "DejaVu Sans", Arial, sans-serif; }
    .small { letter-spacing:.02em; }
  </style>
</defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" opacity="1" /><text x="42" y="58" font-size="28" font-weight="900" fill="#0B1020" text-anchor="start" class="">Phản hồi xác thực · Quy tắc cuối</text><text x="42" y="88" font-size="12" font-weight="600" fill="#64748B" text-anchor="start" class="">Toast top-end, kiểm tra mật khẩu theo tiêu chí và modal xác minh OTP.</text><rect x="42" y="126" width="360" height="520" rx="16" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#tinyShadow)"/><text x="62" y="158" font-size="15" font-weight="800" fill="#0B1020" text-anchor="start" class="">1. Toast top-end</text><text x="62" y="178" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Không che tiêu đề, trường nhập hoặc CTA</text><rect x="72" y="194" width="300" height="82" rx="14" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="72" y="194" width="5" height="82" rx="3" fill="#10B981" stroke="#10B981" stroke-width="1" opacity="1" /><circle cx="100" cy="221" r="13" fill="#10B981" stroke="none" stroke-width="1" /><text x="100" y="226" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="">✓</text><text x="121" y="221" font-size="13" font-weight="800" fill="#0B1020" text-anchor="start" class="">Đăng nhập thành công</text><text x="121" y="244" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Đang mở Trang chủ.</text><text x="354" y="218" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle" class="">×</text><rect x="72" y="296" width="300" height="82" rx="14" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="72" y="296" width="5" height="82" rx="3" fill="#EF4444" stroke="#EF4444" stroke-width="1" opacity="1" /><circle cx="100" cy="323" r="13" fill="#EF4444" stroke="none" stroke-width="1" /><text x="100" y="328" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="">!</text><text x="121" y="323" font-size="13" font-weight="800" fill="#0B1020" text-anchor="start" class="">Mật khẩu chưa đủ mạnh</text><text x="121" y="346" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Bổ sung ký tự đặc biệt.</text><text x="354" y="320" font-size="16" font-weight="700" fill="#64748B" text-anchor="middle" class="">×</text><text x="72" y="424" font-size="11" font-weight="800" fill="#64748B" text-anchor="start" class="">Vị trí</text><text x="72" y="450" font-size="12" font-weight="700" fill="#0B1020" text-anchor="start" class="">Desktop và mobile: top-end + safe-area.</text><text x="72" y="482" font-size="12" font-weight="700" fill="#0B1020" text-anchor="start" class="">Tự đóng sau 5 giây; lỗi có hành động giữ lại.</text><rect x="430" y="126" width="360" height="520" rx="16" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#tinyShadow)"/><text x="450" y="158" font-size="15" font-weight="800" fill="#0B1020" text-anchor="start" class="">2. Checklist mật khẩu</text><text x="450" y="178" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Không chỉ dùng một thanh “mạnh/yếu”</text><text x="460" y="186" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" class="">Mật khẩu</text><rect x="460" y="194" width="300" height="46" rx="12" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" /><text x="474" y="222.0" font-size="13" font-weight="500" fill="#0B1020" text-anchor="start" class="">Twight2026</text><circle cx="738" cy="217.0" r="11" fill="#EF4444" stroke="none" stroke-width="1" /><text x="738" y="222.0" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="">×</text><text x="460" y="266" font-size="11" font-weight="800" fill="#64748B" text-anchor="start" class="">Mức độ an toàn của mật khẩu</text><circle cx="470.0" cy="277" r="9" fill="#10B981" stroke="none" stroke-width="1" /><text x="470.0" y="281" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="">✓</text><text x="487.0" y="281" font-size="10" font-weight="700" fill="#0B1020" text-anchor="start" class="">Tối thiểu 8 ký tự</text><circle cx="470.0" cy="307" r="9" fill="#10B981" stroke="none" stroke-width="1" /><text x="470.0" y="311" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="">✓</text><text x="487.0" y="311" font-size="10" font-weight="700" fill="#0B1020" text-anchor="start" class="">Có chữ hoa và chữ thường</text><circle cx="470.0" cy="337" r="9" fill="#10B981" stroke="none" stroke-width="1" /><text x="470.0" y="341" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="">✓</text><text x="487.0" y="341" font-size="10" font-weight="700" fill="#0B1020" text-anchor="start" class="">Có ít nhất một chữ số</text><circle cx="470.0" cy="367" r="9" fill="#EF4444" stroke="none" stroke-width="1" /><text x="470.0" y="371" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="">×</text><text x="487.0" y="371" font-size="10" font-weight="700" fill="#EF4444" text-anchor="start" class="">Thiếu ký tự đặc biệt</text><text x="460" y="432" font-size="12" font-weight="700" fill="#0B1020" text-anchor="start" class="">Mỗi tiêu chí có biểu tượng và mô tả.</text><text x="460" y="462" font-size="12" font-weight="700" fill="#0B1020" text-anchor="start" class="">Thông báo bằng aria-live khi trạng thái đổi.</text><rect x="818" y="126" width="420" height="520" rx="16" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#tinyShadow)"/><text x="838" y="158" font-size="15" font-weight="800" fill="#0B1020" text-anchor="start" class="">3. OTP hợp lệ</text><text x="838" y="178" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Modal xác nhận trước khi mở form mới</text><rect x="850" y="188" width="356" height="250" rx="18" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1" opacity="1" filter="url(#shadow)"/><circle cx="1028" cy="244" r="26" fill="#10B981" stroke="none" stroke-width="1" /><text x="1028" y="252" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="">✓</text><text x="1028" y="296" font-size="17" font-weight="900" fill="#0B1020" text-anchor="middle" class="">Mã xác minh hợp lệ</text><text x="890" y="326" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" class="">Nhấn tiếp tục để nhập mật khẩu mới.</text><rect x="882" y="374" width="292" height="44" rx="12" fill="url(#brand)" stroke="none" stroke-width="1" opacity="1" filter="url(#tinyShadow)"/><text x="1028.0" y="401.0" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" class="">OK, nhập mật khẩu mới</text><text x="850" y="482" font-size="12" font-weight="900" fill="#6C5CE7" text-anchor="start" class="">Sau OK:</text><text x="850" y="510" font-size="11" font-weight="700" fill="#0B1020" text-anchor="start" class="">• Modal đóng và focus vào trường mật khẩu mới.</text><text x="850" y="538" font-size="11" font-weight="700" fill="#0B1020" text-anchor="start" class="">• OTP không còn hiển thị hoặc có thể chỉnh sửa.</text><text x="850" y="566" font-size="11" font-weight="700" fill="#0B1020" text-anchor="start" class="">• Thành công thu hồi mọi phiên cũ.</text></svg>
