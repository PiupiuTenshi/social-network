<text x="638" y="560" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Client kết nối trực tiếp</text>
<rect x="900" y="500" width="210" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="16" opacity="1"/>
<text x="1005.0" y="534" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">ICE/STUN</text>
<text x="918" y="560" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Ưu tiên đường trực tiếp</text>
<rect x="1180" y="500" width="220" height="120" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" rx="16" opacity="1"/>
<text x="1290.0" y="534" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">TURN fallback</text>
<text x="1198" y="560" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Khi NAT/firewall chặn</text>
