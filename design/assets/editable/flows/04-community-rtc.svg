<line x1="1290" y1="260" x2="725" y2="500" stroke="#64748B" stroke-width="2" opacity="1"/>
<polygon points="725,500 730.6763175775803,491.7671743150695 734.8661418748428,501.63071901487467" fill="#64748B" stroke="none" stroke-width="1"/>
<line x1="830" y1="560" x2="900" y2="560" stroke="#64748B" stroke-width="2" opacity="1"/>
<polygon points="900,560 891.5567207449799,565.3582679497899 891.5567207449799,554.6417320502101" fill="#64748B" stroke="none" stroke-width="1"/>
<line x1="1110" y1="560" x2="1180" y2="560" stroke="#64748B" stroke-width="2" opacity="1"/>
<polygon points="1180,560 1171.5567207449799,565.3582679497899 1171.5567207449799,554.6417320502101" fill="#64748B" stroke="none" stroke-width="1"/>
<text x="60" y="760" font-size="14" font-weight="700" fill="#64748B" text-anchor="start" opacity="1">LiveKit mang media; SignalR chỉ mang metadata/lời mời. RTC lỗi không làm hỏng kênh văn bản.</text>
</svg>
