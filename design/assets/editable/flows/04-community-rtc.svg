<text x="1005.0" y="244" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Kiểm tra quyền</text>
<text x="918" y="270" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">JoinVoice/Speak/ScreenShar</text>
<text x="918" y="287" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">e</text>
<rect x="1180" y="140" width="220" height="120" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" rx="16" opacity="1"/>
<text x="1290.0" y="174" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Cấp token</text>
<text x="1198" y="200" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">TTL ngắn, scoped capability</text>
<rect x="1180" y="330" width="220" height="120" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" rx="16" opacity="1"/>
<text x="1290.0" y="364" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Từ chối</text>
<text x="1198" y="390" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">403, không lộ dữ liệu</text>
<rect x="620" y="500" width="210" height="120" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" rx="16" opacity="1"/>
