<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id='title'>Luồng cộng đồng và RTC</title>
<desc id='desc'>Bản thiết kế UI/UX có thể chỉnh sửa.</desc>
<defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity=".10"/>
          </filter>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#496DFF"/>
          </linearGradient>
          <style>
            text { font-family: "DejaVu Sans", Arial, sans-serif; }
            .t { fill: #0F172A; }
            .m { fill: #64748B; }
          </style>
        </defs>
<rect x="0" y="0" width="1600" height="900" fill="#F8FAFC" stroke="none" stroke-width="1" rx="0" opacity="1"/>
<rect x="0" y="0" width="1600" height="110" fill="url(#brandGrad)" stroke="none" stroke-width="1" rx="0" opacity="1"/>
<text x="56" y="54" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Luồng cộng đồng và RTC</text>
<text x="56" y="84" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="start" opacity="0.92">Membership, permission, token ngắn hạn và LiveKit trực tiếp</text>
<rect x="60" y="210" width="210" height="120" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" rx="16" opacity="1"/>
<text x="165.0" y="244" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Mở cộng đồng</text>
<text x="78" y="270" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Xem kênh theo quyền</text>
<rect x="340" y="210" width="210" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="16" opacity="1"/>
<text x="445.0" y="244" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Chọn phòng</text>
<text x="358" y="270" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Thoại / video / screen</text>
<rect x="620" y="210" width="210" height="120" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="16" opacity="1"/>
<text x="725.0" y="244" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="1">Xin RTC token</text>
<text x="638" y="270" font-size="11" font-weight="500" fill="#64748B" text-anchor="start" opacity="1">Không tin userId client</text>
