  SET-01:
    status: needs_changes
    note: "Đổi tên ứng dụng là Twight Light\nCác từ bên phải cần chỉnh sửa cho maketing hơn\nLogo cá nhân sẽ đc chỉnh ở góc bên phải trên, chỉ có logo, khi ấn vô thì xổ các chức năng xuống như về trang cá nhân, cài đặt, ngôn ngữ, chỉnh sáng tối...\nbảng tin thì chia thêm các trường như trang chủ, video, buôn bán... nằm ở góc trên thay vì bên trái\nxóa thanh tạo bài viết\nHiện thị hồ sơ cần là bạn bè, tùy chọn, tất cả, ko cho phép\ntrạng thái hiện diện sửa là trạng thái hoạt động chỉ có nút là bật và tắt\nAi có thể nhắn tin và xem hồ sơ (cho phép nhắn tin và xem hồ sơ, nếu ngla nhắn và xem sẽ thông báo về cho người dùng)\nCho phép tìm thông qua thông tin cá nhân, giúp có thể tìm thông qua email, số điện thoại, tên người dùng..."
