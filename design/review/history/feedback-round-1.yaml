    note: "Đổi tên ứng dụng là Twight Light\nCác từ bên phải cần chỉnh sửa cho maketing hơn\nLogo cá nhân sẽ đc chỉnh ở góc bên phải trên, chỉ có logo, khi ấn vô thì xổ các chức năng xuống như về trang cá nhân, cài đặt, ngôn ngữ, chỉnh sáng tối...\nbảng tin thì chia thêm các trường như trang chủ, video, buôn bán... nằm ở góc trên thay vì bên trái\nxóa thanh tạo bài viết\nTài khoản chặn sẽ ko bao h thấy đc thông tin của người chặn, 2 bên ko thể nhắn tin, khi tham gia các cộng đồng chung sẽ hiện thị thông báo người này bạn đã chặn có muốn tham gia cộng đồng hay ko. Có cả thông tin lí do chặn"
